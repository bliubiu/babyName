# nginx/nginx-lan.conf
# ============================================================
# 局域网部署变体（无域名 / 无 SSL 证书场景）
# 用于 192.168.x.x 等内网虚拟机：纯 HTTP 80，IP 直访
# 编排: docker compose --env-file .env.production \
#         -f docker-compose.yml -f docker-compose.lan.yml up -d
# 产物与主 nginx.conf 同构（upstream 仅 backend，SSR 全栈已无前端容器），
# 差异：去掉 443/证书/域名 server_name/ACME 路径，避免
# 「无法加载 /etc/letsencrypt/live/...fullchain.pem」启动崩溃。
# ============================================================

user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 4096;
    use epoll;
    multi_accept on;
    accept_mutex off;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format lan '$remote_addr - [$time_local] "$request" '
                   '$status $body_bytes_sent rt=$request_time '
                   '"$http_user_agent" host="$host"';

    access_log /var/log/nginx/access.log lan buffer=32k flush=5s;
    error_log /var/log/nginx/error.log warn;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    keepalive_requests 1000;
    types_hash_max_size 2048;
    client_max_body_size 10M;

    # Gzip 压缩（与主配置同参：静态资源 + JSON）
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/xml+rss
        application/atom+xml
        image/svg+xml;

    # 限流区域（内网部署宽松：生成接口 30r/min）
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=100r/s;
    limit_req_zone $binary_remote_addr zone=generate_limit:10m rate=30r/m;

    upstream backend {
        server backend:8080;
        keepalive 32;
    }

    # ===== 唯一 server：IP 直访（server_name _ + default_server）=====
    server {
        listen 80 default_server;
        listen [::]:80 default_server;
        server_name _;

        # 容器健康检查放行（compose healthcheck 打 localhost/healthz）
        location = /healthz {
            access_log off;
            return 200 "ok\n";
        }

        # ===== SSR 页面路由（Go html/template 由 backend 直接渲染）=====
        location / {
            proxy_pass http://backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 30s;
            proxy_buffering off;
        }

        # ===== API 代理（后端服务）=====
        location /api/ {
            limit_req zone=api_limit burst=200 nodelay;
            proxy_pass http://backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_read_timeout 60s;
            proxy_send_timeout 60s;
            proxy_buffering on;
        }

        # 起名生成接口专项限流（内网放宽到 30r/min 突发 5）
        location /api/names/generate {
            limit_req zone=generate_limit burst=5 nodelay;
            proxy_pass http://backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_read_timeout 60s;
        }

        # ===== 健康检查透出后端（便于浏览器/脚本探活）=====
        location /healthz-backend {
            access_log off;
            proxy_pass http://backend/healthz;
        }

        # ===== 自托管静态资源（Tailwind 构建产物，缓存头由后端设置）=====
        location /assets/ {
            proxy_pass http://backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            access_log off;
        }

        # 禁止访问隐藏文件
        location ~ /\.(?!well-known) {
            deny all;
        }
    }
}
