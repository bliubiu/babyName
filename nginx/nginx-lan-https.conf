# nginx/nginx-lan-https.conf
# ============================================================
# 局域网 HTTPS 变体（自签名证书）
# 前置：宿主机生成自签证书放入 nginx/lan-certs/（见 docs/26 局域网部署）
#   openssl req -x509 -nodes -newkey rsa:2048 -days 825 \
#     -keyout nginx/lan-certs/server.key -out nginx/lan-certs/server.crt \
#     -subj "/CN=namer.lan" \
#     -addext "subjectAltName=IP:192.168.10.180,DNS:namer.lan"
# 编排: docker compose --env-file .env.production \
#         -f docker-compose.yml -f docker-compose.lan-https.yml up -d
# 访问: https://<虚拟机IP>/ （浏览器首次提示不受信任 → 手动继续，或导入
#       server.crt 到 Windows 受信任的根证书颁发机构）
# 与 nginx-lan.conf 差异：:80 仅跳转 :443；443 含全部代理逻辑。
# ============================================================

user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 4096;
    use epoll;
    multi_accept on;
    accept_mutex off;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format lan_https '$remote_addr - [$time_local] "$request" '
                         '$status $body_bytes_sent rt=$request_time';
    access_log /var/log/nginx/access.log lan_https buffer=32k flush=5s;
    error_log /var/log/nginx/error.log warn;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    client_max_body_size 10M;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript
               application/json application/javascript image/svg+xml;

    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=100r/s;
    limit_req_zone $binary_remote_addr zone=generate_limit:10m rate=30r/m;

    upstream backend {
        server backend:8080;
        keepalive 32;
    }
    # ===== :80 → :443 跳转 + 探活 =====
    server {
        listen 80 default_server;
        listen [::]:80 default_server;
        server_name _;

        # 探活留在 :80（浏览器/脚本直打 80 也能确认存活）
        location = /healthz {
            access_log off;
            return 200 "ok\n";
        }
        location / {
            return 301 https://$host$request_uri;
        }
    }

    # ===== :443 主站（自签名）=====
    server {
        listen 443 ssl http2 default_server;
        listen [::]:443 ssl default_server;
        server_name _;

        ssl_certificate     /etc/nginx/lan-certs/server.crt;
        ssl_certificate_key /etc/nginx/lan-certs/server.key;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;
        ssl_prefer_server_ciphers off;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 10m;

        # 内网自签场景放宽公网级安全头（自签 + LAN，攻面有限）
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;

        location = /healthz {
            access_log off;
            return 200 "ok\n";
        }

        # SSR 页面（Go html/template 由 backend 直接渲染）
        location / {
            proxy_pass http://backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_read_timeout 30s;
            proxy_buffering off;
        }

        location /api/ {
            limit_req zone=api_limit burst=200 nodelay;
            proxy_pass http://backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_read_timeout 60s;
            proxy_buffering on;
        }

        location /api/names/generate {
            limit_req zone=generate_limit burst=5 nodelay;
            proxy_pass http://backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_read_timeout 60s;
        }

        # 自托管静态资源（Tailwind 构建产物，缓存头由后端设置）
        location /assets/ {
            proxy_pass http://backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            access_log off;
        }

        location ~ /\.(?!well-known) {
            deny all;
        }
    }
}
