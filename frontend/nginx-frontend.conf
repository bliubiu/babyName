# 前端容器内部静态服务配置（nginx-frontend.conf）
# 项目前端为 Next.js 静态导出（next.config: output:'export', distDir:'.next'），
# 编译中间产物落在 .next/，交付目录 out/ 只含纯静态文件；容器内用 nginx 提供服务，
# 外层 nginx 再反代到此容器。compose 健康检查与反代上游均指向 :3000。

server {
    # 双栈监听：容器内 localhost 解析可能优先 ::1（busybox wget 实测），
    # 仅 listen IPv4 会令健康检查 Connection refused
    listen 3000;
    listen [::]:3000;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # gzip：out/ 里主要是 JS/JSON 文本
    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # ------------------------------------------------------------------
    # 静态资源白名单（docs/45 P1-31）
    # distDir 分离是根本修复；本白名单是纵深防御：即使将来配置回退、或
    # 误把中间产物复制进镜像，也不会把构建日志/服务端代码暴露到公网。
    # nginx 正则 location 按出现顺序「首个匹配者胜出」，故拒绝规则必须
    # 排在所有放行规则之前。
    # ------------------------------------------------------------------

    # ① 构建中间产物目录一律 404（旧配置下 out/dev/、out/server/ 等即在此列）
    location ~ ^/(?:dev|\.next|\.next-build|server|cache|build|logs|trace|types)(?:/|$) {
        return 404;
    }

    # ② 构建清单 / 源码映射 / package.json 等开发态文件一律 404
    location ~ ^/(?:.*(?:build|prerender|routes|fallback-build|middleware|next-font|app-paths|pages)-manifest\.(?:json|js)|package\.json|.*\.map)$ {
        return 404;
    }

    # ③ 放行静态导出交付物：
    #    - 常规静态文件（html/css/js/json/txt/图片/字体/PWA manifest）
    #    - Next.js App Router 的 RSC flight payload：*.txt 与无扩展名的 __next.*
    #      （页面内导航依赖它们，不能按「无扩展名一律拒绝」处理）
    #    - 子目录形式：/gate-data/*.json、/<route>/__next.<page>.txt
    location ~ ^/(?:[A-Za-z0-9_-]+/)*(?:[A-Za-z0-9_.-]+\.(?:html|css|js|mjs|json|txt|svg|png|jpe?g|webp|ico|woff2?|webmanifest)|__next\.[A-Za-z0-9_.-]+)$ {
        try_files $uri =404;
    }

    # ④ 带内容哈希的不可变资源，长缓存（^~ 优先于正则）
    location ^~ /_next/static/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # ⑤ 首页
    location = / {
        try_files /index.html =404;
    }

    # ⑥ 页面深链：/result → result.html；其余路径一律 404
    location / {
        try_files $uri $uri.html $uri/index.html =404;
    }
}
