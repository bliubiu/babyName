# 前端容器内部静态服务配置（nginx-frontend.conf）
# 项目前端为 Next.js 静态导出（next.config: output:'export', distDir:'out'），
# 产物是纯静态文件，容器内用 nginx 提供服务；外层 nginx 再反代到此容器。
# compose 健康检查与反代上游均指向 :3000。

server {
    listen 3000;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # gzip：out/ 里主要是 JS/JSON 文本
    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # Next.js 静态导出的路由文件：/result → result.html
    location / {
        try_files $uri $uri.html $uri/ =404;
    }

    # 带内容哈希的不可变资源，长缓存
    location /_next/static/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
}
