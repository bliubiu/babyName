# docker-compose.dev.yml
# ============================================================
# 起名项目 - 开发环境编排（源码挂载，容器内 go run）
# 启动: docker compose -f docker-compose.yml -f docker-compose.dev.yml --env-file .env.development up -d
# ============================================================

version: '3.8'

services:
  # ===== 后端开发（builder 镜像内直接 go run）=====
  backend:
    build:
      # 与生产一致使用仓库根上下文（Dockerfile 需复制根 data/ 字库种子）
      context: .
      dockerfile: backend/Dockerfile
      target: builder  # 使用构建阶段镜像 (包含完整 Go 工具链)
    container_name: namer-backend-dev
    restart: unless-stopped
    command: go run ./cmd/server  # 源码挂载后直接运行（修改后需重启容器）
    environment:
      - GIN_MODE=debug
      - PORT=8080
      - DATA_DIR=/app/data
      # 单一权威库（docs/36 双库分叉治理）：明确绝对路径，避免默认相对 namer.db
      # 在容器内落到非挂载目录（重建即丢）。与 prod compose 保持一致。
      - NAME_DATABASE_PATH=/app/data/namer.db
      # application.yml 随源码挂载在 /app/application.yml，不再去空的 /app/config 找
      - CONFIG_DIR=/app
      - NAME_MODE=api
      - NAME_LOG_LEVEL=debug
      - NAME_LOG_OUTPUT_PATH=/app/logs
    volumes:
      - ./backend:/app                    # 源码挂载 (热重载)
      - /app/tmp                          # 避免覆盖容器内编译产物
      - ./data:/app/data                  # 数据持久化（统一使用仓库根字库）
      - ./backend/logs:/app/logs          # 日志持久化
    networks:
      - namer-network
    ports:
      - "8080:8080"                       # 宿主机端口映射 (便于调试)
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/healthz"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 60s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G

  # ===== 开发环境 Redis (可选) =====
  # ⚠ 安全（docs/29 B15）：开发编排此前把 Redis 以 "6379:6379" 发布到宿主机
  # 0.0.0.0 且未设密码 —— 同一网络内任何主机都能直连、清空甚至写入数据。
  # 现改为仅监听回环地址；如需跨机访问请自行改回端口映射并同时启用密码，
  # 不要把无密码 Redis 暴露到宿主机。
  redis:
    image: redis:7-alpine
    container_name: namer-redis-dev
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_dev_data:/data
    networks:
      - namer-network
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3

networks:
  namer-network:
    driver: bridge
    name: namer-network-dev

volumes:
  redis_dev_data:
    driver: local