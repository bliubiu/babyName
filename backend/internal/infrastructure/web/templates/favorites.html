{{define "content"}}
<h1 class="page-title mb-4">我的收藏</h1>
{{if not .Favorites}}
<div class="ink-card empty-state" data-glyph="藏">
  <p>还没有收藏的名字。</p>
  <p class="text-xs mt-2">在结果页点击「收藏此名」，心仪之名便会珍藏于此。</p>
  <a href="/" class="btn-primary inline-block mt-4">去起名</a>
</div>
{{else}}
<div class="space-y-3">
  {{range .Favorites}}
  <article class="ink-card p-4 flex items-center justify-between gap-3">
    <div>
      <h3 class="name-big" style="font-size:1.25rem;">{{.Surname}}{{.GivenName}} <span class="text-sm" style="color:var(--ink-faint);font-family:'Noto Sans SC',sans-serif;">{{.Pinyin}}</span></h3>
      <p class="text-xs mt-1" style="color:var(--ink-faint);"><span class="tag tag-seal mr-1">评分 {{.Score}}</span><span class="tag mr-1">{{.Gender}}</span><span class="tag mr-1">{{.Source}}</span>{{.CreatedAt.Format "2006-01-02 15:04"}}</p>
    </div>
    <form method="post" action="/favorites/delete" onsubmit="return confirm('确定取消收藏？')">
      <input type="hidden" name="id" value="{{.ID}}">
      <input type="hidden" name="page" value="{{$.Page}}">
      <button type="submit" class="btn-danger text-sm">取消收藏</button>
    </form>
  </article>
  {{end}}
</div>
{{template "pagination" .}}
{{end}}
{{end}}
