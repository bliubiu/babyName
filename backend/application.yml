# 起名项目配置文件

# 服务器配置
server:
  host: "localhost"
  port: 8080
  read_header_timeout: "10s"  # 防止慢速客户端攻击

# 运行模式: api = 仅后端（SSR 页面由 Go 模板直接渲染，无静态目录）；
# all = 历史兼容模式，会额外检查/创建已废弃的 frontend 静态目录。
mode: "api"

# 静态文件目录（仅 all 模式使用，已随前端容器一并废弃）
static: ""

# 日志配置
log:
  level: "debug"        # 日志级别: debug, info, error
  format: "console"     # 日志格式: console, json
  # ★ 日志目录（docs/36 日志路径锚定）：空值固定「项目根/logs/」（以 backend
  # go.mod 为锚，与启动 cwd 无关），文件名 namer-YYYYMMDD.log 按天轮转，
  # 超过 32 天自动清理。自定义时填绝对路径；相对路径会随启动目录漂移，不建议。
  output_path: ""       # 日志目录（空 = 项目根/logs/）

# 数据库配置
database:
  driver: "sqlite"      # 数据库驱动: sqlite, memory
  # ★ 单一权威库（docs/36 双库分叉治理）：本机固定使用 backend/namer.db，
  # 请在 backend/ 目录启动服务；从仓库根启动会落到另一处 ./namer.db。
  # 容器部署由 NAME_DATABASE_PATH 环境变量覆盖为 /app/data/namer.db（挂卷），
  # 不读取此相对路径，故不要在这里写死本机的绝对路径。
  path: "namer.db" # SQLite 数据库（相对 backend/，容器内由环境变量覆盖）

# 限流配置
rate_limit:
  capacity: 100  # 令牌桶容量（每个IP）
  rate: 10       # 令牌生成速率（每秒）

# Redis 配置（可选）
redis:
  enabled: false
  addr: "localhost:6379"
  password: ""
  db: 0
