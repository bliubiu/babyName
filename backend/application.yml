# 起名项目配置文件

# 服务器配置
server:
  host: "localhost"
  port: 8080
  read_header_timeout: "10s"  # 防止慢速客户端攻击

# 运行模式: backend 或 all
mode: "all"

# 静态文件目录（前端构建输出目录）
static: ""  # 默认为 frontend/out

# 日志配置
log:
  level: "debug"        # 日志级别: debug, info, error
  format: "console"     # 日志格式: console, json
  # ★ 日志目录（docs/36 日志路径锚定）：空值固定「项目根/logs/」（以 backend
  # go.mod 为锚，与启动 cwd 无关），文件名 namer-YYYYMMDD.log 按天轮转，
  # 超过 32 天自动清理。自定义时填绝对路径；相对路径会随启动目录漂移，不建议。
  output_path: ""       # 日志目录（空 = 项目根/logs/）

# 数据库配置
database:
  driver: "sqlite"      # 数据库驱动: sqlite, memory
  # ★ 单一权威库（docs/36 双库分叉治理）：必须使用绝对路径，避免 server 从不同
  # cwd 启动（backend/ 或仓库根）时各自生成 ./namer.db 造成双库分叉。
  # 本机权威库为 backend/namer.db（已清理 words/data_meta 孤儿表）。
  # 容器部署由 NAME_DATABASE_PATH 环境变量覆盖为 /app/data/namer.db（挂卷），无需改动此处。
  path: "D:/19-Training/learngo/name/backend/namer.db" # SQLite 数据库绝对路径

# 限流配置
rate_limit:
  capacity: 100  # 令牌桶容量（每个IP）
  rate: 10       # 令牌生成速率（每秒）

# Redis 配置（可选）
redis:
  enabled: false
  addr: "localhost:6379"
  password: ""
  db: 0
