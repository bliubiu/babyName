name: 起名质量与解析说明验证

on:
  push:
    branches: [ "**" ]
  pull_request:
  workflow_dispatch:

# 取消同一分支上仍在运行的老工作流，节省 CI 资源
concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

# Wails v3 的 linux 平台代码有两层约束，CI 用两个开关分别处理：
#   1) pkg/application 的窗口实现需要 server tag 才能编译无窗口变体；
#   2) internal/operatingsystem、internal/assetserver/webview 等包带 cgo 文件
#      （webkit_linux.go 的 //go:build linux && cgo），编译时会经 pkg-config 找
#      gtk4 / webkitgtk-6.0 / glib-2.0 / libsoup-3.0。ubuntu runner 默认
#      CGO_ENABLED=1，于是 go vet ./... 与 go install wails3@v3.0.0 都因缺
#      这些开发库而失败（远端 CI 长期红，见 docs/48 §9.9）。
# CI 只做静态检查、单测、门禁与绑定生成，不需要原生窗口，故全局关闭 CGO，
# 让框架走纯 Go 实现，比在 runner 装数百 MB GTK 开发库更快更稳。
# 已实测 GOOS=linux CGO_ENABLED=0 + -tags=server 下 go build / go vet /
# go install wails3 CLI 均 exit 0，且绑定生成物与入库版本零差异。
# 注意：这与 verify-quality.sh 的 SKIP_SERVER=1（跳过已退役的 HTTP E2E 段）不是一回事。
env:
  GOFLAGS: "-tags=server"
  CGO_ENABLED: "0"

jobs:
  # ---------------------------------------------------------------------------
  # 快路径（无需服务/数据库）：单元 + 门禁审计 + 专项维度巡检 + 覆盖率
  # 覆盖：评分正确性、评分快照防漂移、九维 score_detail 透传、
  #       门禁表覆盖、八字/五行/生肖/诗词出典准确性（dim_audit）
  # ---------------------------------------------------------------------------
  quality-fast:
    name: 质量快路径（单元+门禁+专项维度）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Go
        uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache: true
          cache-dependency-path: backend/go.sum

      - name: 校验种子库完整性（单文件 / 必需物料非空 / 无用户数据）
        working-directory: backend
        run: go run ./tools/build_seed --verify-only

      - name: 运行快路径验证（SKIP_SERVER=1）
        working-directory: ${{ github.workspace }}
        env:
          SKIP_SERVER: "1"
        run: bash scripts/verify-quality.sh

  # ---------------------------------------------------------------------------
  # Wails v3 绑定一致性（docs/48 §4.2）
  # 绑定调用走 $Call.ByID(数字ID)，Go 方法增删/改名后若不重新生成，
  # 前后端 ID 会静默错位。此 job 用与 go.mod 同版本的 CLI 重生成并 diff，
  # 生成物（frontend/bindings/）必须入库，缺改即失败。
  # ---------------------------------------------------------------------------
  quality-bindings:
    name: Wails v3 绑定一致性（重新生成 + diff）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Go
        uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache: true
          cache-dependency-path: backend/go.sum

      - name: 安装 wails3 CLI（与 go.mod / @wailsio/runtime 同为 v3.0.0）
        # go install pkg@version 在模块外编译 CLI 自身，清掉全局 server tag，
        # 避免把业务侧的构建约束带进 CLI 构建；CGO_ENABLED=0 由全局 env 生效，
        # 使 internal/operatingsystem 的 cgo 文件被排除，无需 GTK/WebKit 开发库。
        env:
          GOFLAGS: ""
        run: go install github.com/wailsapp/wails/v3/cmd/wails3@v3.0.0

      - name: 重新生成 TS 绑定
        working-directory: backend
        run: |
          WAILS3="$(go env GOPATH)/bin/wails3"
          "$WAILS3" generate bindings -ts -d ../frontend/bindings

      - name: 生成物必须与入库版本一致
        run: git diff --exit-code -- frontend/bindings

  # ---------------------------------------------------------------------------
  # 前端三件套（docs/45 阶段 0 / P1-29）：类型检查 + ESLint + 单元测试
  # 与 Go 门禁解耦：Go job 不需要 Node，本 job 不需要 Go。
  # hook 可被 SKIP_VERIFY / --no-verify 绕过，故 CI 必须独立存在。
  # Go 侧门禁与单测统一从入库的 data/namer.db 装配（ADR-010 单库路线），
  # 不再依赖 data/*.json 白名单；Playwright 23 例需 Chromium 与隔离库，
  # 仍由本地 `cd frontend && pnpm e2e` 承担（docs/48 阶段 3）。
  # ---------------------------------------------------------------------------
  quality-frontend:
    name: 前端门禁（tsc + eslint + vitest）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 安装 pnpm
        uses: pnpm/action-setup@v4
        with:
          # pnpm-workspace.yaml 使用 allowBuilds 映射（pnpm 11+ 语法，见该文件注释）
          version: '11'
          run_install: false

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: 安装前端依赖（--frozen-lockfile）
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: 运行前端三件套（缺依赖即失败）
        working-directory: ${{ github.workspace }}
        run: bash scripts/verify-frontend.sh --require
