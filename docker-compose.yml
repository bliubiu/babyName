# docker-compose.yml
# ============================================================
# 起名项目 - 生产环境编排
# 启动: docker compose --env-file .env.production up -d
# ============================================================

version: '3.8'

services:
  # ===== Nginx 反向代理 + SSL 终结 =====
  nginx:
    image: nginx:alpine
    container_name: namer-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - /data/certbot/conf:/etc/letsencrypt:ro
      - /data/certbot/www:/var/www/certbot:ro
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy
    networks:
      - namer-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost/healthz"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ===== 后端服务 (Go Gin) =====
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      args:
        - GOPROXY=https://goproxy.cn,direct
    container_name: namer-backend
    restart: unless-stopped
    environment:
      - GIN_MODE=${GIN_MODE:-release}
      # ---- 配置来源（docs/29 B12）----
      # 配置文件搜索目录。宿主机配置挂载在 /app/config，而进程 cwd 是 /app，
      # 必须显式告知去哪儿找，否则配置文件被静默跳过、整套默认值生效。
      - CONFIG_DIR=/app/config
      # ---- 以下均需 NAME_ 前缀 ----
      # viper 的 AutomaticEnv 带 NAME_ 前缀（docs/29 B13）。原来的
      # PORT / LOG_LEVEL / LOG_DIR 三个变量名对配置层完全无效：
      # 设了不生效，日志级别与日志文件路径一律走默认值。
      #
      # server.host 必须是 0.0.0.0：默认值 localhost 只绑定回环地址，
      # 容器外（含 nginx）根本连不上，表现为「容器 healthy 但 502」。
      - NAME_SERVER_HOST=0.0.0.0
      - NAME_SERVER_PORT=${PORT:-8080}
      # 日志文件必须落在挂载卷内，否则写容器可写层，重启/重建即丢
      - NAME_LOG_LEVEL=${LOG_LEVEL:-info}
      - NAME_LOG_OUTPUT_PATH=${LOG_DIR:-/app/logs}/namer.log
      # 数据库文件必须落在挂载卷内。默认值是相对路径 namer.db，
      # 会写到 /app/namer.db —— 不在任何挂载卷里，重建容器数据全丢。
      - NAME_DATABASE_PATH=/app/data/namer.db
      - DATA_DIR=${DATA_DIR:-/app/data}
      # 注意：JWT_SECRET / JWT_EXPIRE 为历史遗留死配置，后端无任何鉴权实现，
      # 设置它们不产生保护作用。公网暴露请在 Nginx/网关层做访问控制。
      # 详见 DOCKER_QUICKSTART.md 安全提示（docs/29 B14）。
      # 数据库 (可选 PostgreSQL)
      # - DSN=${DSN}
      # Redis (可选)
      # - REDIS_ADDR=${REDIS_ADDR:-redis:6379}
      # - REDIS_PASSWORD=${REDIS_PASSWORD}
      # - REDIS_DB=${REDIS_DB:-0}
    volumes:
      - /data/namer/backend/data:/app/data
      - /data/namer/backend/logs:/app/logs
      - /data/namer/backend/config:/app/config
    networks:
      - namer-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/healthz"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 128M

  # ===== 前端服务 =====
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: namer-frontend
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_API_BASE=${NEXT_PUBLIC_API_BASE:-http://localhost:8080}
      - NEXT_PUBLIC_WS_BASE=${NEXT_PUBLIC_WS_BASE:-ws://localhost:8080}
      - NEXT_PUBLIC_APP_NAME=${NEXT_PUBLIC_APP_NAME:-起名工具}
      - NEXT_PUBLIC_APP_VERSION=${NEXT_PUBLIC_APP_VERSION:-1.0.0}
    networks:
      - namer-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 15s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
        reservations:
          cpus: '0.1'
          memory: 64M

  # ===== 可选: Redis 缓存/会话 =====
  # redis:
  #   image: redis:7-alpine
  #   container_name: namer-redis
