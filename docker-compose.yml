  #     resources:
  #       limits:
  #         memory: 256M

  # ===== 可选: PostgreSQL 数据库 =====
  # postgres:
  #   image: postgres:16-alpine
  #   container_name: namer-postgres
  #   restart: unless-stopped
  #   environment:
  #     POSTGRES_DB: namer
  #     POSTGRES_USER: namer
  #     POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
  #   volumes:
  #     - postgres_data:/var/lib/postgresql/data
  #   networks:
  #     - namer-network
  #   healthcheck:
  #     test: ["CMD-SHELL", "pg_isready -U namer"]
